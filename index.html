<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ردیاب زنده پیش‌بینی Allora (v7 API)</title>
    <!-- Load Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Configure Tailwind theme and font -->
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Vazirmatn:wght@100..900&display=swap');
        
        :root {
            font-family: 'Vazirmatn', sans-serif;
        }

        /* Custom styling for the prediction cards */
        .prediction-card {
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1), 0 4px 6px -4px rgba(0, 0, 0, 0.05);
            transition: transform 0.3s ease;
        }
        .prediction-card:hover {
            transform: translateY(-3px);
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.2), 0 10px 10px -5px rgba(0, 0, 0, 0.1);
        }
    </style>
</head>
<body class="bg-gray-50 dark:bg-gray-900 text-gray-900 dark:text-gray-100 p-4 md:p-8">

    <div class="max-w-7xl mx-auto">
        <!-- Title and Description -->
        <header class="text-center mb-10">
            <h1 class="text-4xl font-extrabold text-indigo-600 dark:text-indigo-400">ردیاب زنده اوراکل Allora</h1>
            <p class="mt-2 text-xl text-gray-600 dark:text-gray-400">پیش‌بینی‌های هوش مصنوعی شبکه Allora برای قیمت ارزهای دیجیتال</p>
            <div id="status-message" class="mt-4 p-2 text-sm font-medium rounded-lg bg-yellow-100 text-yellow-800 dark:bg-yellow-900 dark:text-yellow-300">
                در حال بارگذاری داده‌ها... (استفاده از Endpoint قدیمی v7)
            </div>
        </header>

        <!-- Prediction Cards Container -->
        <div id="predictions-container" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-6">
            <!-- Cards will be added here by JavaScript -->
        </div>

        <!-- Footer and Update Information -->
        <footer class="mt-10 pt-6 border-t border-gray-200 dark:border-gray-700 text-center text-sm text-gray-500 dark:text-gray-400">
            <p id="last-updated">آخرین به‌روزرسانی: در حال بارگذاری...</p>
            <p class="mt-1">داده‌ها هر ۳۰ ثانیه از API Allora (v7) و CoinGecko واکشی می‌شوند.</p>
        </footer>
    </div>

    <script>
        // --- Configuration and API Settings ---
        // ⚠️ توجه: این Endpoint به احتمال زیاد خطای "Not Implemented" (کد ۵۰۱ یا ۱۲) را برمی‌گرداند.
        const ALLORA_API_KEY = "UP-662ebd02310c4509bf66dc1e"; 
        // Endpoint ورژن ۷ مورد درخواست کاربر
        const ALLORA_API_BASE = "https://allora-api.testnet.allora.network/emissions/v7/latest_network_inferences/";
        
        const LIVE_PRICE_API = "https://api.coingecko.com/api/v3/simple/price?ids=bitcoin,ethereum,solana&vs_currencies=usd";
        const REFRESH_INTERVAL = 30000; // 30 seconds

        // --- List of specific topics ---
        const ALL_PREDICTION_TOPICS = [
            { asset: "BTC", tf: "5m", topicId: 14, name_fa: "بیت‌کوین (۵ دقیقه)", cg_id: "bitcoin" },
            { asset: "BTC", tf: "8h", topicId: 42, name_fa: "بیت‌کوین (۸ ساعت)", cg_id: "bitcoin" },
            { asset: "BTC", tf: "1d", topicId: 69, name_fa: "بیت‌کوین (۱ روز)", cg_id: "bitcoin" },
            
            { asset: "ETH", tf: "5m", topicId: 13, name_fa: "اتریوم (۵ دقیقه)", cg_id: "ethereum" },
            { asset: "ETH", tf: "6h", topicId: 46, name_fa: "اتریوم (۶ ساعت)", cg_id: "ethereum" },
            { asset: "ETH", tf: "8h", topicId: 41, name_fa: "اتریوم (۸ ساعت)", cg_id: "ethereum" },

            { asset: "SOL", tf: "5m", topicId: 37, name_fa: "سولانا (۵ دقیقه)", cg_id: "solana" },
            { asset: "SOL", tf: "10m", topicId: 5, name_fa: "سولانا (۱۰ دقیقه)", cg_id: "solana" },
            { asset: "SOL", tf: "8h", topicId: 38, name_fa: "سولانا (۸ ساعت)", cg_id: "solana" },
        ];

        let isFetching = false;

        /**
         * Calculates percentage change and determines direction/color.
         */
        function calculateChange(live, predicted) {
            if (!live || !predicted) return { percentage: 0, direction: '—', color: 'text-gray-500' };
            live = parseFloat(live);
            predicted = parseFloat(predicted);

            const percentage = ((predicted - live) / live) * 100;
            let direction = '▬';
            let color = 'text-gray-500';

            if (percentage > 0.01) {
                direction = '▲';
                color = 'text-green-500';
            } else if (percentage < -0.01) {
                direction = '▼';
                color = 'text-red-500';
            }
            
            return { percentage: percentage.toFixed(2), direction, color };
        }

        /**
         * Fetches Allora prediction for a specific topic using the V7 endpoint.
         */
        async function getAlloraPrediction(topicId) {
            const alloraUrl = `${ALLORA_API_BASE}${topicId}`;
            try {
                const response = await fetch(alloraUrl, {
                    headers: {
                        // API Key is MANDATORY for this V7 endpoint
                        'x-api-key': ALLORA_API_KEY,
                        'Accept': 'application/json'
                    }
                });
                
                if (!response.ok) {
                    // This is where the HTTP 501 or 404 error will be logged
                    console.error(`❌ API Allora HTTP Error for Topic ${topicId} (V7): ${response.status} ${response.statusText}`);
                    // Attempt to read the JSON even on error to check for code 12 (Not Implemented)
                    const errorData = await response.json().catch(() => ({}));
                    if (errorData.code === 12) {
                        console.error(`Endpoint V7 is confirmed Not Implemented by Allora Server.`);
                    }
                    return 0;
                }
                
                const data = await response.json();
                
                // Extract combined_value from the V7 structure
                const combinedValue = data.network_inferences?.combined_value;

                if (!combinedValue || parseFloat(combinedValue) === 0) {
                    console.warn(`⚠️ Topic ${topicId}: Prediction is unavailable (V7 Endpoint). Raw response data:`, data);
                    return 0;
                }
                
                return parseFloat(combinedValue);
            } catch (error) {
                // This will catch the 'Failed to fetch' error from the browser (CORS/Retired Endpoint)
                console.error(`❌ Fatal Error fetching Topic ${topicId} (V7). Endpoint is likely retired or blocked by CORS.`, error.message);
                return 0; 
            }
        }

        /**
         * Fetches live prices and predictions concurrently.
         */
        async function getFinalTrackerData() {
            if (isFetching) return;
            isFetching = true;
            document.getElementById('status-message').textContent = 'در حال واکشی داده‌های جدید از شبکه Allora...';
            document.getElementById('status-message').className = 'mt-4 p-2 text-sm font-medium rounded-lg bg-yellow-100 text-yellow-800 dark:bg-yellow-900 dark:text-yellow-300';

            try {
                // 1. Fetch live prices concurrently
                const livePricesRes = await fetch(LIVE_PRICE_API);
                const livePrices = await livePricesRes.json();

                // 2. Create promises for all topics
                const predictionPromises = ALL_PREDICTION_TOPICS.map(async (topic) => {
                    const prediction = await getAlloraPrediction(topic.topicId);
                    const livePrice = livePrices[topic.cg_id]?.usd || 0;
                    const change = calculateChange(livePrice, prediction);

                    return {
                        ...topic,
                        livePrice: livePrice,
                        prediction: prediction,
                        change: change,
                    };
                });

                // 3. Execute all promises
                const results = await Promise.all(predictionPromises);
                renderData(results);
                
                document.getElementById('status-message').textContent = 'عملیات واکشی کامل شد. (کنسول را برای خطا بررسی کنید)';
                document.getElementById('status-message').className = 'mt-4 p-2 text-sm font-medium rounded-lg bg-green-100 text-green-800 dark:bg-green-900 dark:text-green-300';

            } catch (error) {
                console.error("خطای کلی در واکشی داده:", error);
                document.getElementById('status-message').textContent = 'خطای بحرانی در واکشی داده‌ها. (کنسول را بررسی کنید)';
                document.getElementById('status-message').className = 'mt-4 p-2 text-sm font-medium rounded-lg bg-red-100 text-red-800 dark:bg-red-900 dark:text-red-300';
            } finally {
                isFetching = false;
                document.getElementById('last-updated').textContent = `آخرین به‌روزرسانی: ${new Date().toLocaleTimeString('fa-IR', { hour: '2-digit', minute: '2-digit', second: '2-digit' })}`;
            }
        }

        /**
         * Renders the data to the DOM.
         */
        function renderData(data) {
            const container = document.getElementById('predictions-container');
            container.innerHTML = ''; // Clear previous content

            data.forEach(item => {
                // Display '-' if prediction is 0
                const predictionValue = item.prediction > 0 ? item.prediction : '—';
                const predictionStr = predictionValue === '—' ? '—' : `$${predictionValue.toLocaleString('en-US', { maximumFractionDigits: 2 })}`;

                const livePriceStr = `$${item.livePrice.toLocaleString('en-US', { maximumFractionDigits: 2 })}`;
                const changeIndicator = predictionValue === '—' ? '—' : `${item.change.direction} ${item.change.percentage}%`;
                
                const card = document.createElement('div');
                card.className = `prediction-card bg-white dark:bg-gray-800 p-6 rounded-xl border border-gray-200 dark:border-gray-700`;
                
                card.innerHTML = `
                    <div class="flex justify-between items-start mb-4 border-b border-dashed pb-3 dark:border-gray-700">
                        <h2 class="text-2xl font-bold ${item.asset === 'BTC' ? 'text-orange-500' : item.asset === 'ETH' ? 'text-gray-400' : 'text-blue-500'}">
                            ${item.asset} - ${item.tf}
                        </h2>
                        <div class="text-xs font-mono text-gray-500 dark:text-gray-400 p-1 bg-gray-100 dark:bg-gray-700 rounded-md">
                            Topic ID: ${item.topicId}
                        </div>
                    </div>
                    
                    <p class="text-md text-gray-500 dark:text-gray-400 mb-4">${item.name_fa} (پیش‌بینی)</p>

                    <div class="space-y-3">
                        <div class="flex justify-between items-center bg-gray-50 dark:bg-gray-700 p-3 rounded-lg">
                            <span class="text-sm font-medium text-gray-600 dark:text-gray-300">قیمت لایو</span>
                            <span class="text-lg font-extrabold text-gray-900 dark:text-gray-100">${livePriceStr}</span>
                        </div>
                        
                        <div class="flex justify-between items-center p-3 rounded-lg border-2 ${predictionValue === '—' ? 'border-gray-300' : 'border-indigo-200 dark:border-indigo-600'} bg-indigo-50 dark:bg-gray-700/50">
                            <span class="text-sm font-medium ${predictionValue === '—' ? 'text-gray-500' : 'text-indigo-700 dark:text-indigo-300'}">پیش‌بینی Allora</span>
                            <span class="text-xl font-extrabold ${predictionValue === '—' ? 'text-gray-500' : 'text-indigo-700 dark:text-indigo-400'}">${predictionStr}</span>
                        </div>
                        
                        <div class="flex justify-between items-center p-2 rounded-lg bg-gray-50 dark:bg-gray-700">
                            <span class="text-sm font-medium text-gray-600 dark:text-gray-300">تغییر مورد انتظار</span>
                            <span class="text-md font-extrabold ${item.change.color}">${changeIndicator}</span>
                        </div>
                    </div>
                `;
                container.appendChild(card);
            });
        }

        // --- Start Application ---
        window.onload = function () {
            // Initial fetch
            getFinalTrackerData();
            // Set up automatic refresh
            setInterval(getFinalTrackerData, REFRESH_INTERVAL);
        };
    </script>
</body>
</html>
